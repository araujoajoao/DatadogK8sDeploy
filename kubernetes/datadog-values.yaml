datadog:
  apiKey: "2e72626d09606242895bfe90858fd6e7"
  appKey: "6abe6b3979892fae8c2234f530ef6477345fee4f"
  clusterName: "datadog-cluster"
  hostname: "datadog-agent-host"
  site: "datadoghq.com"

  logs:
    enabled: true
    containerCollectAll: true

  apm:
    enabled: true

  processAgent:
    enabled: true

  orchestratorExplorer:
    enabled: true

  kubelet:
    tlsVerify: false
    enabled: true

  kubeStateMetricsCore:
    enabled: true

  collectKubernetesEvents: true

  kubeResourcesCollection:
    enabled: true

  clusterAgent:
    enabled: true
    replicas: 1
    token: "pub00543973842a6393404434af9e5e8022"
    image:
      tag: "1.18.0"

  useHostNetwork: false

  listeners:
    - name: kubelet

  autodiscovery:
    enabled: true

  clusterChecks:
    enabled: true

  tags:
    - "env:develop"
    - "k8s_cluster:datadog-cluster"

agents:
  image:
    tag: "7.33.0"
  securityContext:
    readOnlyRootFilesystem: false
    runAsUser: 0
    privileged: true
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
    - effect: NoExecute
      key: node-role.kubernetes.io/etcd
      operator: Exists

  volumeMounts:
    - name: auth-token
      mountPath: /var/run/datadog/auth

volumes:
  - name: auth-token
    emptyDir:
      medium: "Memory"

containers:
  agent:
    env:
      - name: DD_API_KEY
        valueFrom:
          secretKeyRef:
            name: datadog-secret
            key: api-key
      - name: DD_APP_KEY
        valueFrom:
          secretKeyRef:
            name: datadog-secret
            key: app-key
      - name: DD_HOSTNAME
        value: "datadog-agent-host"
      - name: DD_SITE
        value: "datadoghq.com"
      - name: DD_KUBERNETES_KUBELET_HOST
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: DD_KUBELET_TLS_VERIFY
        value: "false"
      - name: DD_COLLECT_KUBERNETES_EVENTS
        value: "true"
      - name: DD_ENABLE_ORCHESTRATOR_EXPLORER
        value: "true"
      - name: DD_APM_ENABLED
        value: "true"
      - name: DD_PROCESS_AGENT_ENABLED
        value: "true"
      - name: DD_LOGS_ENABLED
        value: "true"
      - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
        value: "true"
      - name: DD_ENV
        value: "production"

clusterAgent:
  enabled: true
  replicas: 1
  containers:
    cluster-agent:
      env:
        - name: DD_CLUSTER_NAME
          value: "datadog-cluster"
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-secret
              key: api-key
        - name: DD_APP_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-secret
              key: app-key
