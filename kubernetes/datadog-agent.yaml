apiVersion: v1
kind: ConfigMap
metadata:
  name: datadog-agent
  namespace: default
data:
  datadog.yaml: |
    api_key: "<YOUR_DATADOG_API_KEY>"

    # Enable logs collection
    logs:
      enabled: true
      container_collect_all: true  # Collect logs from all containers

    # Enable APM (tracing)
    apm_config:
      enabled: true

    # Enable the Live Process Collection
    process_config:
      enabled: "true"

    # Enable the Datadog Cluster Agent
    cluster_agent:
      enabled: true
      auth_token: "<YOUR_DATADOG_AGENT_TOKEN>"

    # Enable orchestrator explorer (requires Datadog Agent >= v7.41.0)
    orchestrator_explorer:
      enabled: true

    # Enable metrics collection
    kube_state_metrics_core:
      enabled: true

    # Collect events from Kubernetes API
    collect_kubernetes_events: true

    # Autodiscovery for containerized environments
    listeners:
      - name: kubelet

    # Datadog Cluster Checks
    cluster_checks:
      enabled: true

    # Enable Kubernetes service discovery
    autodiscovery:
      enabled: true

    # Tags to help filter resources in Datadog UI
    tags:
      - "env:production"
      - "k8s_cluster:my-cluster"

    # Collect namespaces (Datadog Agent >= v7.41.0 required)
    kube_resources_collection:
      enabled: true

    # Enable Kubernetes resource metadata collection
    kubelet:
      enabled: true