apiVersion: v1
kind: ConfigMap
metadata:
  name: java-logging-config
  namespace: apps
data:
  logback.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
          <pattern>{"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSS}","level":"%level","logger":"%logger{36}","message":"%msg","error.stack":"%replace(%ex){'[\r\n\t]+',' '}","dd.service":"%X{dd.service}","dd.env":"%X{dd.env}","dd.version":"%X{dd.version}","dd.trace_id":"%X{dd.trace_id}","dd.span_id":"%X{dd.span_id}"}%n</pattern>
        </encoder>
      </appender>
      <root level="INFO">
        <appender-ref ref="STDOUT" />
      </root>
    </configuration>
