apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  labels:
    app: apache
    tags.datadoghq.com/env: "mentoria"
    tags.datadoghq.com/service: "apache"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
        tags.datadoghq.com/env: "mentoria"
        tags.datadoghq.com/service: "apache"
      annotations:
        ad.datadoghq.com/httpd-setup.exclude: "true"
        ad.datadoghq.com/apache.logs: '[{"source": "apache", "service": "apache"}]'
        ad.datadoghq.com/apache.checks: |
          {
            "apache": {
              "instances": [
                {
                  "apache_status_url": "http://%%host%%/server-status?auto"
                }
              ]
            }
          }
    spec:
      initContainers:
      - name: httpd-setup
        image: httpd:latest
        command:
          - sh
          - -c
          - |
            cp -r /usr/local/apache2/conf/* /conf/
            echo "<Location /server-status>" >> /conf/httpd.conf
            echo "    SetHandler server-status" >> /conf/httpd.conf
            echo "    Require all granted" >> /conf/httpd.conf
            echo "</Location>" >> /conf/httpd.conf
            echo "ExtendedStatus On" >> /conf/httpd.conf
        volumeMounts:
        - name: httpd-conf
          mountPath: /conf
      containers:
      - name: apache
        image: httpd:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: httpd-conf
          mountPath: /usr/local/apache2/conf
        - name: apache-logs
          mountPath: /usr/local/apache2/logs
      volumes:
      - name: httpd-conf
        emptyDir: {}
      - name: apache-logs
        emptyDir: {}
