apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  labels:
    app: python-app
    tags.datadoghq.com/env: "mentoria"
    tags.datadoghq.com/service: "python-app"
    tags.datadoghq.com/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
        tags.datadoghq.com/env: "mentoria"
        tags.datadoghq.com/service: "python-app"
        tags.datadoghq.com/version: "latest"
      annotations:
        ad.datadoghq.com/python-app.logs: '[{"source": "python", "service": "python-app"}]'
    spec:
      # 1. INIT CONTAINER: Baixa o tracer oficial do Python e copia para o volume
      initContainers:
      - name: datadog-tracer-init
        image: gcr.io/datadoghq/dd-lib-python-init:latest
        command: ["sh", "-c", "cp -r /datadog-init/* /datadog-lib/"]
        volumeMounts:
        - name: datadog-tracer
          mountPath: /datadog-lib
          
      containers:
      - name: python-app
        image: araujoajoao/python-app:latest
        command: ["ddtrace-run", "python", "app.py"]
        ports:
        - containerPort: 5000
        env:
          # 2. INJEÇÃO PYTHON: Aponta o diretório para o Python carregar o pacote
          - name: PYTHONPATH
            value: "/datadog-lib/"
          # ==========================================================
          - name: DD_AGENT_HOST
            value: "datadog-agent.default.svc.cluster.local"
          - name: DD_TRACE_AGENT_PORT
            value: "8126"
          - name: DD_DOGSTATSD_PORT
            value: "8125"
          - name: DD_LOGS_INJECTION
            value: "true"
          - name: DD_SERVICE
            value: "python-app"
          - name: DD_ENV
            value: "mentoria"
          - name: DD_VERSION
            value: "latest"
          - name: DD_RUNTIME_METRICS_ENABLED
            value: "true"
            
        # 3. VOLUME: Monta o mesmo diretório na aplicação final
        volumeMounts:
        - name: datadog-tracer
          mountPath: /datadog-lib
          
      # 4. DISCO TEMPORÁRIO COMPARTILHADO
      volumes:
      - name: datadog-tracer
        emptyDir: {}