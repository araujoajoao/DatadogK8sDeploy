apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-app
  labels:
    app: dotnet-app
    tags.datadoghq.com/env: "mentoria"
    tags.datadoghq.com/service: "dotnet-app"
    tags.datadoghq.com/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-app
  template:
    metadata:
      labels:
        app: dotnet-app
        tags.datadoghq.com/env: "mentoria"
        tags.datadoghq.com/service: "dotnet-app"
        tags.datadoghq.com/version: "latest"
      annotations:
        ad.datadoghq.com/dotnet-app.logs: '[{"source": "dotnet", "service": "dotnet-app"}]'
    spec:
      # 1. INIT CONTAINER: Baixa o tracer oficial do .NET e copia para o volume
      initContainers:
      - name: datadog-tracer-init
        image: gcr.io/datadoghq/dd-lib-dotnet-init:latest
        command: ["sh", "-c", "cp -r /datadog-init/* /datadog-lib/"]
        volumeMounts:
        - name: datadog-tracer
          mountPath: /datadog-lib
          
      containers:
      - name: dotnet-app
        image: araujoajoao/dotnet-app:latest
        ports:
        - containerPort: 80
        env:
          # 2. INJEÇÃO .NET: Variáveis mandatórias para a CLR carregar o Profiler
          - name: CORECLR_ENABLE_PROFILING
            value: "1"
          - name: CORECLR_PROFILER
            value: "{846F5F1C-F9AE-4B07-969E-05C26BC060D8}"
          - name: CORECLR_PROFILER_PATH
            value: "/datadog-lib/Datadog.Trace.ClrProfiler.Native.so"
          - name: DD_DOTNET_TRACER_HOME
            value: "/datadog-lib"
          # ==========================================================
          - name: DD_AGENT_HOST
            value: "datadog-agent.default.svc.cluster.local"
          - name: DD_TRACE_AGENT_PORT
            value: "8126"
          - name: DD_DOGSTATSD_PORT
            value: "8125"
          - name: DD_LOGS_INJECTION
            value: "true"
          - name: DD_SERVICE
            value: "dotnet-app"
          - name: DD_ENV
            value: "mentoria"
          - name: DD_VERSION
            value: "latest"
          - name: DD_RUNTIME_METRICS_ENABLED
            value: "true"
          - name: DD_TRACE_METRICS_ENABLED
            value: "true"
            
        # 3. VOLUME: Monta o mesmo diretório na aplicação final
        volumeMounts:
        - name: datadog-tracer
          mountPath: /datadog-lib
          
      # 4. DISCO TEMPORÁRIO COMPARTILHADO
      volumes:
      - name: datadog-tracer
        emptyDir: {}