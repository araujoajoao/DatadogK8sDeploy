apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-app
  labels:
    app: dotnet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-app
  template:
    metadata:
      labels:
        app: dotnet-app
      annotations:
        ad.datadoghq.com/dotnet-app.logs: '[{"source": "dotnet", "service": "dotnet-app"}]'
    spec:
      containers:
      - name: dotnet-app
        image: araujoajoao/dotnet-app:latest
        ports:
        - containerPort: 5000
        env:
          - name: DD_LOGS_INJECTION
            value: "true"
          - name: DD_SERVICE
            value: "dotnet-app"
          - name: DD_ENV
            value: "develop"
          - name: DD_VERSION
            value: "latest"
