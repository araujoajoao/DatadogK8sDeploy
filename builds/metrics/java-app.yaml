apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  labels:
    app: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
      annotations:
        ad.datadoghq.com/java-app.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "prometheus_url": "http://%%host%%:8080/metrics",
                  "namespace": "java_app",
                  "metrics": ["*"]
                }
              ]
            }
          }
    spec:
      containers:
      - name: java-app
        image: araujoajoao/java-app:latest
        ports:
        - containerPort: 8080
        env:
          - name: DD_LOGS_INJECTION
            value: "true"
          - name: DD_SERVICE
            value: "java-app"
          - name: DD_ENV
            value: "develop"
          - name: DD_VERSION
            value: "latest"
