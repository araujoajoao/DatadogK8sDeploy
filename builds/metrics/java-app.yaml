apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  labels:
    app: java-app
    tags.datadoghq.com/env: "mentoria"
    tags.datadoghq.com/service: "java-app"
    tags.datadoghq.com/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
        tags.datadoghq.com/env: "mentoria"
        tags.datadoghq.com/service: "java-app"
        tags.datadoghq.com/version: "latest"
      annotations:
        ad.datadoghq.com/java-app.logs: '[{"source": "java", "service": "java-app"}]'
    spec:
      # 1. INIT CONTAINER: Baixa o tracer oficial e copia para o volume
      initContainers:
      - name: datadog-tracer-init
        image: gcr.io/datadoghq/dd-lib-java-init:latest
        command: ["sh", "-c", "cp -r /datadog-init/* /datadog-lib/"]
        volumeMounts:
        - name: datadog-tracer
          mountPath: /datadog-lib
      
      containers:
      - name: java-app
        image: araujoajoao/java-app:latest
        ports:
        - containerPort: 8080
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-javaagent:/datadog-lib/package/dd-java-agent.jar"
          - name: DD_AGENT_HOST
            value: "datadog-agent.default.svc.cluster.local"
          - name: DD_TRACE_AGENT_PORT
            value: "8126"
          - name: DD_DOGSTATSD_PORT
            value: "8125"
          - name: DD_LOGS_INJECTION
            value: "true"
          - name: DD_SERVICE
            value: "java-app"
          - name: DD_ENV
            value: "mentoria"
          - name: DD_VERSION
            value: "latest"
          - name: DD_JVM_METRICS_ENABLED
            value: "true"
        
        # 3. VOLUME: Monta o mesmo diretório na aplicação final
        volumeMounts:
        - name: datadog-tracer
          mountPath: /datadog-lib
          
      # 4. DISCO TEMPORÁRIO COMPARTILHADO
      volumes:
      - name: datadog-tracer
        emptyDir: {}